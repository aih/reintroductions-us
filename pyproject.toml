[project]
name = "reintroductions"
version = "0.1.0"
description = "Prepare US Congress bills for reintroduction in the next Congress, in USLM 2.0"
requires-python = ">=3.11"
dependencies = [
    "lxml>=5.2",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "jinja2>=3.1",
    "httpx>=0.27",
    "markdown>=3.6",
    "python-multipart>=0.0.9",
    "weasyprint>=62",
]

[project.optional-dependencies]
ingest = [
    "united-states-congress @ git+https://github.com/unitedstates/congress.git",
]

[dependency-groups]
dev = ["pytest>=8"]

[project.scripts]
reintro = "reintro.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["reintro"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: needs the network (uscode.linkedlegislation.org, govinfo.gov)"]
addopts = "-m 'not network'"
