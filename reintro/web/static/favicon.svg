<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <title>Reintroductions</title>
  <style>
    .arrow { fill: none; stroke: #1d5fb4; stroke-width: 7; stroke-linejoin: round; }
    .head { fill: #1d5fb4; }
    .page { fill: #fff; stroke: #12325e; stroke-width: 2.2; stroke-linejoin: round; }
    .mark { fill: #12325e; }
    @media (prefers-color-scheme: dark) {
      .arrow { stroke: #7eb0ff; } .head { fill: #7eb0ff; }
      .page { fill: #10213d; stroke: #cfe0ff; } .mark { fill: #cfe0ff; }
    }
  </style>
  <!-- Three chasing arrows, each bent around one corner of a triangle, as in the
       recycling symbol: the first runs up the left side, round the top corner and
       down the right side; the other two are it turned 120 and 240 degrees about
       the centre (32, 37.5). -->
  <g id="a">
    <path class="arrow" d="M 22.13 26.10 L 28.05 15.84 Q 32.00 9.00 35.95 15.84 L 39.65 22.25"/>
    <path class="head" d="M 45.90 18.07 L 45.33 32.09 L 32.91 25.57 Z"/>
  </g>
  <use href="#a" transform="rotate(120 32 37.5)"/>
  <use href="#a" transform="rotate(240 32 37.5)"/>
  <!-- A bill page with a section sign, drawn as two interlocking S curves. -->
  <path class="page" d="M 26 30 H 35.5 L 38.5 33 V 47 H 26 Z"/>
  <path class="mark" transform="translate(32.2 38.6) scale(0.62) translate(-30.5 -34)" d="M 34.6 27.6 c -0.6 -1 -1.7 -1.6 -3 -1.6 c -2 0 -3.4 1.1 -3.4 2.7 c 0 3.6 6.6 2.8 6.6 6.4 c 0 1.2 -0.8 2.1 -2 2.6 l -1 -1.4 c 0.7 -0.3 1 -0.7 1 -1.2 c 0 -2.3 -6.6 -1.7 -6.6 -6.2 c 0 -0.9 0.4 -1.7 1 -2.2 Z M 26.4 40.4 c 0.6 1 1.7 1.6 3 1.6 c 2 0 3.4 -1.1 3.4 -2.7 c 0 -3.6 -6.6 -2.8 -6.6 -6.4 c 0 -1.2 0.8 -2.1 2 -2.6 l 1 1.4 c -0.7 0.3 -1 0.7 -1 1.2 c 0 2.3 6.6 1.7 6.6 6.2 c 0 0.9 -0.4 1.7 -1 2.2 Z"/>
</svg>
